<style>

}
/* تم دستی (خورشید/ماه): بدون انتخاب، رنگ‌ها از تلگرام می‌آید */
html[data-theme=dark]{--bg:#17212b;--fg:#f5f5f5;--hint:#8a9aab;--card:#232e3c;--btn:#2f8fd8;--btnfg:#fff;--link:#6ab3f3;--line:rgba(255,255,255,.14)}

#thm{position:fixed;top:8px;inset-inline-end:8px;z-index:8;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
#thm button{border:0;background:none;font-size:15px;width:30px;height:28px;border-radius:99px;cursor:pointer;line-height:1;padding:0;opacity:.55}
#thm button.on{background:var(--bg);opacity:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Vazirmatn,sans-serif}
body{padding:0 14px calc(86px + env(safe-area-inset-bottom));min-height:100vh}
#app{max-width:560px;margin:0 auto}
h1{font-size:19px;margin:16px 2px 10px}h2{font-size:16px;margin:14px 2px 8px}
.hint{color:var(--hint);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0}
.hero{background:linear-gradient(135deg,var(--btn),color-mix(in srgb,var(--btn) 55%,#000));color:var(--btnfg);border-radius:18px;padding:18px;margin:14px 0}
.hero small{opacity:.85}.hero b{display:block;font-size:26px;margin:2px 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card);border:0;border-radius:var(--r);padding:14px 8px;text-align:center;color:var(--fg);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.tile .ic{font-size:26px;line-height:1}.tile span{font-size:13px}
.tile:active,.row:active,.b:active{opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:var(--r);padding:13px 14px;margin:8px 0;cursor:pointer;border:0;width:100%;color:var(--fg);font:inherit;text-align:start}
.row .sub{color:var(--hint);font-size:13px}.row b{white-space:nowrap}
.b{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;background:var(--btn);color:var(--btnfg);width:100%;cursor:pointer;margin:6px 0}
.b.sec{background:var(--card);color:var(--fg)}.b.success{background:var(--ok);color:#fff}.b.danger{background:var(--err);color:#fff}.b.ok{background:var(--ok);color:#fff}.b.sm{width:auto;padding:8px 12px;font-size:13px;margin:0}
.b:disabled{opacity:.5}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:12px;font:inherit;outline:none}
input:focus{border-color:var(--btn)}
.flex{display:flex;gap:8px;align-items:center}.flex>*{flex:1}.flex>.b{flex:0 0 auto;width:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--line)}
.badge.done{background:rgba(46,164,79,.18);color:var(--ok)}.badge.bad{background:rgba(217,58,58,.16);color:var(--err)}.badge.wait{background:rgba(217,130,43,.18);color:var(--warn)}

.copy code{word-break:break-all;font-size:14px}.copy button{border:0;background:var(--btn);color:var(--btnfg);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
.lbl{font-size:12px;color:var(--hint);margin-top:8px}

.toast.err{background:var(--err)}
.center{text-align:center;padding:60px 10px}.big{font-size:54px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--btn);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}

.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin:8px 0}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:inherit;color:var(--fg);cursor:pointer}.seg button.on{background:var(--btn);color:var(--btnfg)}
.sp{height:8px}

/* ======== پوسته‌ی «شیشه‌ی شفق» ======== */
html[data-theme=dark]{--bg:#0a0e1d;--fg:#eef1ff;--hint:#9aa3c7;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--btn:#6d7cff;--btnfg:#fff;--link:#8fb4ff;
  --glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.13);--edge:rgba(255,255,255,.2);--shd:0 12px 34px rgba(2,4,20,.55);--a1:#22d3ee;--a2:#8b5cf6;--a3:#f472b6;--gold:#fbbf24;--ok:#34d399;--err:#fb7185;--warn:#fbbf24}
html[data-theme=light]{--bg:#eaeefb;--fg:#161b36;--hint:#5f6890;--card:rgba(255,255,255,.6);--line:rgba(60,70,140,.16);--btn:#5568ff;--btnfg:#fff;--link:#3b55e6;
  --glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.85);--edge:rgba(255,255,255,.95);--shd:0 12px 30px rgba(70,80,160,.18);--a1:#38bdf8;--a2:#a78bfa;--a3:#fb7ab8;--gold:#f59e0b;--ok:#16a34a;--err:#e11d48;--warn:#d97706}
body{background:var(--bg);position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:120vmax;height:120vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:aur 26s ease-in-out infinite alternate}
body::before{top:-70vmax;inset-inline-start:-50vmax;background:radial-gradient(circle,var(--a2) 0,transparent 55%)}
body::after{bottom:-75vmax;inset-inline-end:-55vmax;background:radial-gradient(circle,var(--a1) 0,transparent 55%);animation-delay:-9s}
html[data-theme=light] body::before,html[data-theme=light] body::after{opacity:.38}
@keyframes aur{to{transform:translate(8vmax,6vmax) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
.card,.tile,.row,.seg,.copy,.chips button,#thm,.tabs{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shd),inset 0 1px 0 var(--edge);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5)}
html[data-theme=dark] .card,html[data-theme=dark] .tile,html[data-theme=dark] .row,html[data-theme=dark] .seg,html[data-theme=dark] .tabs,html[data-theme=dark] #thm{border-color:var(--line)}

.hero::before{content:"";position:absolute;inset-inline-end:-40px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.5),transparent 65%)}

.tile.k-stars{--tg:var(--gold)}.tile.k-premium{--tg:var(--a2)}.tile.k-gift{--tg:var(--a3)}.tile.k-vpn{--tg:#22d3ee}

/* رنگ سفارشی دکمه‌ها (از پنل وب) */
.row[style*="--cc"]{border-color:var(--cc);box-shadow:0 6px 18px color-mix(in srgb,var(--cc) 35%,transparent),inset 0 1px 0 var(--edge)}

/* =====================================================================
   طراحی نسخه‌ی ۲ — «کیف پول» : کارت اعتباری، کاشی‌های رنگی جامد، سطح‌های مات
   (این بلوک آخر می‌آید و ظاهر قبلی را بازنویسی می‌کند؛ ساختار و منطق دست‌نخورده)
   ===================================================================== */
html[data-theme=dark]{--bg:#090d17;--fg:#f3f6ff;--hint:#8f9bbd;--surface:#111a2d;--raised:#192541;--line:#25314d;
  --card:#111a2d;--glass:#111a2d;--glass2:#192541;--edge:#25314d;--shd:0 10px 26px rgba(0,0,0,.42);
  --btn:#7c5cff;--a1:#22d3ee;--a2:#a06bff;--a3:#ff6b9a;--gold:#ffc233;--ok:#34d399;--err:#ff6b81;--warn:#ffc233}
html[data-theme=light]{--bg:#f0f3fb;--fg:#111830;--hint:#5b6685;--surface:#ffffff;--raised:#f6f8fe;--line:#dde2f1;

function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function toast(msg, bad) {
  const d = el(`<div class="toast ${bad ? "err" : ""}">${esc(msg)}</div>`);
  document.body.appendChild(d); setTimeout(() => d.remove(), 3200);
  try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred(bad ? "error" : "success"); } catch (e) {}
}
function copyText(v) {
  const done = () => toast(t("کپی شد"));
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(v).then(done, () => fallback()); } else fallback();
  function fallback() { const a = document.createElement("textarea"); a.value = v; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e) {} a.remove(); done(); }
}
function openLink(u) { try { if (/^https:\/\/t\.me\//.test(u) && TG.openTelegramLink) return TG.openTelegramLink(u); TG.openLink(u); } catch (e) { window.open(u, "_blank"); } }
function badge(st, text) {
  const c = st === "done" ? "done" : (["failed", "refunded", "cancelled"].includes(st) ? "bad" : "wait");
  return `<span class="badge ${c}">${esc(text)}</span>`;
}
function fdate(ts) { try { return new Date(ts * 1000).toLocaleString(I && I.lang === "fa" ? "fa-IR" : undefined, {dateStyle: "short", timeStyle: "short"}); } catch (e) { return ""; } }

async function api(action, data) {
  let r;
  try {
    r = await fetch("/app/api/" + action, {method: "POST", headers: {"Content-Type": "application/json", "X-Init-Data": TG ? TG.initData : ""}, body: JSON.stringify(data || {})});
  } catch (e) { throw {msg: t("اتصال برقرار نشد؛ دوباره تلاش کنید."), code: "net"}; }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw {msg: j.error || "error", code: j.code || "", status: r.status};
  return j;
}
async function run(btnEl, fn) {          // اجرای اکشن با قفل کردن دکمه و نمایش خطا
  if (btnEl) btnEl.disabled = true;
  try { return await fn(); }
  catch (e) { handleErr(e); }
  finally { if (btnEl) btnEl.disabled = false; }
}
function handleErr(e) {
  if (e && e.code === "auth") return blocked("🔒", t("این برنامه فقط از داخل تلگرام باز می‌شود."));
  if (e && (e.code === "banned" || e.code === "maintenance" || e.code === "disabled")) return blocked(e.code === "maintenance" ? "🛠" : "⛔", e.msg);
  if (e && e.code && e.code.indexOf("join:") === 0) return joinGate(e.channels || (e.code.length > 5 ? [{t: t("📢 عضویت در کانال"), url: "https://t.me/" + e.code.slice(5), s: ""}] : []), e.msg);
  toast((e && e.msg) || t("خطای ناشناخته"), true);
}
function blocked(icon, msg) {
  $app.innerHTML = `<div class="center"><div class="big">${icon}</div><p>${esc(msg)}</p></div>`;
  document.getElementById("tabs").innerHTML = "";
}
function joinGate(chans, msg) {
  $app.innerHTML = `<div class="center"><div class="big">📢</div><p>${esc(msg)}</p>
    ${chans.map((c, i) => `<button class="b ${esc(c.s || "")}" data-j="${i}">${esc(c.t)}</button>`).join("")}<button class="b sec" id="j2">${esc(t("✅ بررسی عضویت"))}</button></div>`;
  document.getElementById("tabs").innerHTML = "";
  $app.querySelectorAll("[data-j]").forEach(b => b.onclick = () => openLink(chans[+b.dataset.j].url));
  $app.querySelector("#j2").onclick = () => boot();
}

/* ------------ مسیریابی ------------ */
const stack = [];
let current = null;
function go(name, arg, replace) {
  if (current && !replace) stack.push(current);
  current = {name, arg};
  render();
}
function back() { current = stack.pop() || {name: "home"}; render(); }
function home() { stack.length = 0; current = {name: "home"}; render(); }
function setBack() {
  if (!TG || !TG.BackButton) return;
  TG.BackButton.offClick(back);
  if (current && current.name !== "home" && !TABS.some(x => x.name === current.name && !x.center)) { TG.BackButton.show(); TG.BackButton.onClick(back); } else TG.BackButton.hide();
}
const TABS = [{name: "home", ic: "🏠", k: "tab_home"}, {name: "products", ic: "🛍", k: "tab_products"}, {name: "add", center: true}, {name: "wallet", ic: "👛", k: "tab_wallet"}, {name: "referral", ic: "🎁", k: "tab_invite"}];
const tabLabel = () => ({home: t("خانه"), products: t("محصولات"), wallet: t("کیف پول"), referral: t("دعوت")});
const MU = () => I.mui || {};
const L = (k, d) => (MU()[k] && MU()[k].t) || d;
const emo = (id, fb) => `<img class="pe" src="/app/emoji/${id}" alt="" data-fb="${esc(fb)}">`;
const CS = k => {
  const c = MU()[k] && MU()[k].c;
  if (!c) return "";
  const n = parseInt(c.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return ` style="--tg:${c};--cc:${c};--ccfg:${lum > 0.62 ? "#1a1405" : "#ffffff"}"`;
};
const IC = (k, d) => (MU()[k] && MU()[k].e) ? emo(MU()[k].e, d) : esc(d);
/* ایموجی پریمیوم: اول تصویر؛ اگر ویدیویی بود <video>؛ اگر هیچ‌کدام، ایموجی معمولی */
document.addEventListener("error", ev => {
  const im = ev.target;
  if (!im || im.tagName !== "IMG" || !im.classList.contains("pe")) return;
  const fb = () => im.replaceWith(document.createTextNode(im.dataset.fb || ""));
  const v = document.createElement("video");
  v.className = "pe"; v.src = im.src; v.muted = v.loop = v.autoplay = v.playsInline = true; v.setAttribute("playsinline", "");
  v.onerror = fb; im.replaceWith(v); v.play && v.play().catch(() => {});
}, true);
const TAB_PAGES = ["skins", "home", "products", "wallet", "referral", "catalog", "orders", "more", "lang", "support", "rules", "vpn", "vpn_my", "vpn_test", "agent", "agent_my"];
function drawTabs() {
  const box = document.getElementById("tabs");
  const show = TAB_PAGES.includes(current.name);
  box.innerHTML = show ? `<div class="tabs">${TABS.map(x => x.center
    ? `<button data-n="products" class="add" aria-label="+"><span class="plus">+</span></button>`
    : `<button data-n="${x.name}" class="${current.name === x.name ? "on" : ""}"${CS(x.k)}><span class="ic">${IC(x.k, x.ic)}</span>${esc(L(x.k, tabLabel()[x.name]))}</button>`).join("")}</div>` : "";
  box.querySelectorAll("button").forEach(b => b.onclick = () => { stack.length = 0; current = {name: b.dataset.n}; render(); });
}
async function render() {
  window.scrollTo(0, 0);
  const v = VIEWS[current.name] || VIEWS.home;
  setBack(); drawTabs();
  $app.innerHTML = `<div class="spin"></div>`;
  try { await v(current.arg); } catch (e) { handleErr(e); }
}

  const zp = $app.querySelector("#zp"); if (zp) zp.onclick = () => openLink(r.url);

function setupReceipt(r) {
  const f = $app.querySelector("#rf"), pick = $app.querySelector("#pick"), send = $app.querySelector("#send");
  let data = "";
  pick.onclick = () => f.click();
  const bad = () => toast(t("لطفاً فقط عکس رسید را ارسال کنید."), true);
  const show = d => { data = d; $app.querySelector("#pv").innerHTML = `<img src="${d}" style="max-width:100%;border-radius:12px;margin:8px 0">`; send.disabled = false; };
  const toB64 = buf => { let s = "", u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const sniff = u => (u[0] === 0xff && u[1] === 0xd8) ? "image/jpeg" : (u[0] === 0x89 && u[1] === 0x50) ? "image/png" : (u[0] === 0x52 && u[1] === 0x49) ? "image/webp" : "";
  const readBuf = file => file.arrayBuffer ? file.arrayBuffer() : new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => no(fr.error); fr.readAsArrayBuffer(file); });
  const toJpeg = async (file, buf) => {       // کوچک‌کردن و تبدیل به JPEG؛ اگر مرورگر نتوانست، null
    const src = await new Promise(ok => {
      const url = URL.createObjectURL(new Blob([buf], {type: sniff(new Uint8Array(buf, 0, 4)) || file.type || "image/jpeg"})), im = new Image();
      im.onload = () => ok({im, url}); im.onerror = () => { URL.revokeObjectURL(url); ok(null); }; im.src = url;
    });
    if (!src) return null;
    const {im, url} = src, k = Math.min(1, 1600 / Math.max(im.naturalWidth || im.width, im.naturalHeight || im.height));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round((im.naturalWidth || im.width) * k)); c.height = Math.max(1, Math.round((im.naturalHeight || im.height) * k));
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    return c.toDataURL("image/jpeg", 0.85);
  };
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try {
      const buf = await readBuf(file), mime = sniff(new Uint8Array(buf, 0, 4));
      let out = null;
      try { out = await toJpeg(file, buf); } catch (e) { out = null; }
      if (out && out.length > 100) return show(out);
      // مرورگر نتوانست رمزگشایی کند: خودِ فایل بدون تغییر (فقط jpg/png/webp و حداکثر ۵ مگابایت)
      if (mime && buf.byteLength < 5e6) return show(`data:${mime};base64,${toB64(buf)}`);
      toast(t("لطفاً فقط عکس رسید را ارسال کنید.") + (mime ? " (>5MB)" : " (JPG/PNG)"), true);
    } catch (e) { bad(); }
  };
  send.onclick = () => run(send, async () => {
    const s = await api("receipt", {payment_id: r.payment_id, image: data});
    toast(s.message); stack.length = 0; current = {name: "orders"}; render();
  });
}

    <button class="b" id="go">${esc(t("ادامه"))}</button>`;
  const g = $app.querySelector("#go");
  g.onclick = () => run(g, async () => { const o = await api("agent_order", {plan_id: p.id, name: $app.querySelector("#vn").value}); go("order", o.id, true); });
};
VIEWS.agent_my = async () => {

VIEWS.agent_view = async (id) => {
  const s = await api("agent_get", {id});
  let h = `<h1>🧑‍💼 ${esc(s.title || t("پنل نمایندگی"))}</h1><div class="card svc"><div class="nm">${esc(s.username)}</div>${svcStatusBadge(s)}
    ${usageBar(s)}<div class="sline"><span>${esc(t("مصرف: {u}", {u: LTR(s.used_text + " / " + (s.total_text || t("نامحدود")))}))}</span><span>${esc(t("زمان باقی‌مانده: {t}", {t: s.days_left == null ? t("نامحدود") : t("{d} روز", {d: s.days_left})}))}</span></div>
    <div class="sline"><span>${esc(t("تعداد کاربران: {n}", {n: LTR(s.max_users ? s.users + " / " + s.max_users : String(s.users))}))}</span></div></div>`;
  h += copyRow(t("🌐 آدرس پنل"), s.panel_url) + copyRow(t("👤 نام کاربری"), s.username) + copyRow(t("🔑 رمز عبور"), s.password);
  if (s.help) h += `<div class="card hint" style="color:var(--fg)">${safeHtml(s.help)}</div>`;
  h += `<div class="grid"><button class="b" id="rn">🔄 ${esc(t("تمدید"))}</button><button class="b sec" id="rf">♻️ ${esc(t("بروزرسانی"))}</button></div>
    <div class="grid">${s.can_pw ? `<button class="b sec" id="pw">🔑 ${esc(t("رمز جدید"))}</button>` : ""}<button class="b sec" id="sd">📨 ${esc(t("ارسال در چت ربات"))}</button></div>`;
  if (s.addons && s.addons.length) h += `<h2>➕ ${esc(t("حجم/زمان اضافه"))}</h2>` + s.addons.map(a => `<button class="row prod k-vpn" data-ad="${a.id}"><i class="ri">➕</i><span>${esc(a.title)}</span><b>${esc(a.price.short)}</b></button>`).join("");
  if (s.custom) h += Object.keys(s.custom).map(k => { const c = s.custom[k]; return `<div class="card"><div class="nm">✏️ ${esc(k === "gb" ? t("حجم دلخواه") : t("زمان دلخواه"))}</div><p class="hint">${esc((k === "gb" ? t("حداقل حجم خرید {a} گیگ و حداکثر {b} گیگ", {a: c.min, b: c.max}) : t("حداقل زمان خرید {a} روز و حداکثر {b} روز", {a: c.min, b: c.max})))} · ${esc(c.price.short)}/${esc(k === "gb" ? "GB" : t("روز"))}</p><div class="grid"><input type="number" min="${c.min}" max="${c.max}" step="${k === "gb" ? "any" : "1"}" id="cu-${k}" placeholder="${c.min}"><button class="b" data-cu="${k}">${esc(t("خرید"))}</button></div></div>`; }).join("");
  $app.innerHTML = h;
  $app.querySelectorAll("[data-cu]").forEach(b => b.onclick = () => run(b, async () => { const v = +document.getElementById("cu-" + b.dataset.cu).value; const o = await api("agent_custom", {id, kind: b.dataset.cu, amount: v}); go("order", o.id); }));
  $app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => copyText(b.dataset.c));
  $app.querySelectorAll("[data-ad]").forEach(b => b.onclick = () => run(b, async () => { const o = await api("agent_addon", {id, addon_id: +b.dataset.ad}); go("order", o.id); }));
  const on = (sel, fn) => { const b = $app.querySelector(sel); if (b) b.onclick = () => run(b, fn); };
  on("#rn", async () => go("agent_renew", id));
  on("#rf", async () => { await api("agent_get", {id, refresh: 1}); toast(t("بروزرسانی شد.")); render(); });
  on("#sd", async () => { const x = await api("agent_send", {id}); toast(x.message); });
  on("#pw", async () => { if (!confirm(t("⚠️ رمز فعلی پنل تغییر می‌کند و رمز جدید برای شما ارسال می‌شود. ادامه می‌دهید؟"))) return; await api("agent_pw", {id}); toast(t("رمز جدید ثبت شد.")); render(); });
};

  $app.innerHTML = h;
  $app.querySelectorAll(".row.prod").forEach(b => b.onclick = () => run(b, async () => { const o = await api("agent_renew", {id, plan_id: +b.dataset.id}); go("order", o.id); }));
};

VIEWS.orders = async () => {
  const r = await api("orders");
  let h = `<h1>${esc(t("🧾 آخرین سفارش‌های شما:"))}</h1>`;

VIEWS.wallet = async () => {
  const r = await api("wallet");
  const lo = I.limits.min_topup, hi = I.limits.max_topup;
  const quick = [lo, lo * 5, lo * 10, lo * 20].filter((v, i, a) => v <= hi && a.indexOf(v) === i);
  let h = `<div class="hero"><small>${esc(t("موجودی کیف پول"))}</small><b>${num(r.balance)} <small>${esc(t("تومان"))}</small></b></div>
    <h2>➕ ${esc(t("شارژ کیف پول"))}</h2><div class="card"><div class="hint">${esc(t("مبلغ شارژ را به تومان وارد کنید (حداقل {lo}):", {lo: num(lo)}))}</div>
    <input id="amt" type="number" inputmode="numeric" placeholder="${num(lo)}"><div class="chips">${quick.map(v => `<button data-v="${v}">${num(v)}</button>`).join("")}</div>
    <button class="b" id="top">${esc(t("ادامه"))}</button></div>`;
  if (r.history.length) h += `<h2>${esc(t("آخرین تراکنش‌ها:"))}</h2>` + r.history.map(x => `<div class="row" style="cursor:default"><span>${x.amount > 0 ? "➕" : "➖"} ${esc(x.reason)}<div class="sub">${esc(fdate(x.ts))}</div></span><b style="color:${x.amount > 0 ? "var(--ok)" : "var(--err)"}">${num(Math.abs(x.amount))}</b></div>`).join("");
  $app.innerHTML = h;
  $app.querySelectorAll(".chips button").forEach(b => b.onclick = () => { $app.querySelector("#amt").value = b.dataset.v; });
  const top = $app.querySelector("#top");
  top.onclick = () => { const v = parseInt($app.querySelector("#amt").value, 10); if (!(v >= lo && v <= hi)) return toast(t("مبلغ نامعتبر است. بین {lo} تا {hi} تومان، فقط عدد.", {lo: num(lo), hi: num(hi)}), true); go("topup", {amount: v, methods: r.methods}); };
};
VIEWS.topup = async (a) => {
  const labels = {card: "💳 " + t("کارت به کارت"), zarinpal: "🏦 " + t("درگاه بانکی"), ton: "💎 " + t("تون (TON)"), usdt: "💵 " + t("تتر (USDT TRC20)")};
  $app.innerHTML = `<h1>➕ ${esc(t("شارژ کیف پول"))}</h1><div class="card"><b style="font-size:20px">${num(a.amount)} ${esc(t("تومان"))}</b></div><p class="hint">${esc(t("روش پرداخت را انتخاب کنید:"))}</p>` +
    (a.methods.length ? a.methods.map(m => `<button class="row" data-m="${m}"><span>${esc(labels[m] || m)}</span><span>›</span></button>`).join("") : `<div class="card hint">${esc(t("هیچ روش پرداختی فعال نیست."))}</div>`);
  $app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => payWith(null, b.dataset.m, b, a.amount));

VIEWS.referral = async () => {
  const r = await api("referral");

    ${r.bonus ? `<div>🎁 ${esc(t("به‌ازای هر دوست تأییدشده {b} تومان جایزه می‌گیرید.", {b: num(r.bonus)}))}</div>` : ""}
    ${r.need_join ? `<div class="hint">⚠️ ${esc(t("جایزه وقتی فعال می‌شود که دوست شما در کانال ما عضو شود و عضو بماند."))}</div>` : ""}</div>
    ${copyRow(t("لینک دعوت شما"), r.link)}<button class="b" id="share">${esc(t("اشتراک‌گذاری لینک"))}</button>

    ${st.held ? `<div class="card"><div class="hint">${esc(t("در انتظار واریز"))}</div><b>${num(st.held)} ${esc(t("تومان"))}</b></div>` : ""}`;

VIEWS.lang = async () => {
  $app.innerHTML = `<h1>🌐 ${esc(t("زبان"))}</h1>` + I.langs.map(l => `<button class="row" data-l="${l.code}"><span>${esc(l.flag)} ${esc(l.name)}</span><span>${l.code === I.lang ? "✅" : ""}</span></button>`).join("");
  $app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => run(b, async () => { await api("set_lang", {lang: b.dataset.l}); stack.length = 0; await boot(); }));

  let h = `<h1>☎️ ${esc(t("پشتیبانی"))}</h1>`;
  if (I.texts.support) h += `<div class="card">${safeHtml(I.texts.support)}</div>`;

VIEWS.text = async (it) => { $app.innerHTML = `<h1>${esc(it.label)}</h1><div class="card">${safeHtml(it.text || "—")}</div>`; };

VIEWS.skins = async () => {
  const cur = document.documentElement.getAttribute("data-skin") || "a";
  let h = `<h1>🎨 ${esc(t("ظاهر برنامه"))}</h1><p class="hint">${esc(t("ظاهری را که دوست دارید انتخاب کنید؛ فوری اعمال می‌شود و برای دفعه‌های بعد هم ذخیره می‌ماند."))}</p><div class="skgrid">`;
  h += SKINS.map(s => `<button class="sk ${s.k === cur ? "on" : ""}" data-s="${s.k}"><div class="pv" style="background:linear-gradient(135deg,${s.d[0]},${s.d[1]})">${s.d.map(c => `<i style="background:${c}"></i>`).join("")}</div><b>${esc(SKN()[s.k])}</b><small>${esc(s.m === "dark" ? t("همیشه شب") : s.m === "light" ? t("همیشه روز") : t("روز و شب"))}${s.an ? " · ✨ " + esc(t("متحرک")) : ""}</small>${s.k === cur ? `<span class="ck">✓</span>` : ""}</button>`).join("");
  $app.innerHTML = h + `</div>`;
  $app.querySelectorAll(".sk").forEach(b => b.onclick = () => { applySkin(b.dataset.s, true); render(); });
};
VIEWS.more = async () => {
  let h = `<h1>${esc(t("بیشتر"))}</h1>`;
  const rows = [["referral", "🤝", t("زیرمجموعه‌گیری")], ["support", "☎️", t("پشتیبانی")], ["rules", "📜", t("قوانین")]];
  if (I.langs.length) rows.push(["lang", "🌐", t("زبان")]);
  if (I.skin_pick) rows.push(["skins", "🎨", t("ظاهر برنامه")]);
  h += rows.map(r => `<button class="row" data-n="${r[0]}"><span>${r[1]} ${esc(r[2])}</span><span>›</span></button>`).join("");
  h += I.items.map(it => `<button class="row" data-i="${it.id}"><span>${esc(it.label)}</span><span>${it.action === "url" ? "↗" : "›"}</span></button>`).join("");
  if (I.user.is_admin) h += `<button class="row" id="adm"><span>🛠 ${esc(t("پنل مدیریت"))}</span><span>↗</span></button>`;
  $app.innerHTML = h;
  $app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => go(b.dataset.n));
  $app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { const it = I.items.find(x => x.id == b.dataset.i); if (it.action === "url") openLink(it.url); else go("text", it); });
  const a = $app.querySelector("#adm");
  if (a) a.onclick = () => run(a, async () => { const r = await api("admin_login"); location.href = r.url || "/"; });
};

/* ------------ شروع ------------ */
async function boot() {
  try {
    I = await api("init");
    { let k = I.skin || "a"; if (I.skin_pick) { try { const u = localStorage.getItem("ss_skin"); if (u && SKINS.some(x => x.k === u)) k = u; } catch (e) {} }
      else { try { localStorage.removeItem("ss_skin"); localStorage.removeItem("ss_theme"); localStorage.removeItem("ss_pick"); } catch (e) {} }
      applySkin(k, false);
      const tb = document.getElementById("thm"); if (tb) tb.style.display = I.skin_pick ? "" : "none"; }
  } catch (e) { return handleErr(e); }
  UI = I.ui || {};
  document.documentElement.lang = I.lang;
  document.documentElement.dir = I.rtl ? "rtl" : "ltr";
  document.title = I.shop_name || "Shop";
  current = {name: "home"}; stack.length = 0;
  render();
}
boot();
</script>
